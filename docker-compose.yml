version: "3"

services:
  gitea:
    image: gitea/gitea:latest
    container_name: gojira-gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=http://localhost:3300/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
    volumes:
      - gitea-data:/data
    ports:
      - "3300:3000"
    restart: unless-stopped

  agent-service:
    build: ./Agent-Service
    container_name: gojira-agent
    environment:
      - GOJIRA_MONGO_URI=mongodb://host.docker.internal:27017
      - GOJIRA_MONGO_DB=gojira
      - GOJIRA_API_URL=http://host.docker.internal:9001/api/v2
      - GOJIRA_PLATFORM_API=http://host.docker.internal:9000/api/v2
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AGENT_SERVICE_PORT=9002
      - GOJIRA_SKILLS_DIR=/app/skills_data
    volumes:
      - ./GoJIRA-API/skills:/app/skills_data:ro
    ports:
      - "9002:9002"
    restart: unless-stopped

volumes:
  gitea-data:
