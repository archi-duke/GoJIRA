version: "3"

services:
  gitea:
    image: gitea/gitea:latest
    container_name: gojira-gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=http://localhost:3300/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
    volumes:
      - gitea-data:/data
    ports:
      - "3300:3000"
    restart: unless-stopped

  # agent-service는 로컬 uvicorn으로 직접 실행한다 (--reload로 코드 변경 즉시 반영)
  # 실행:
  #   cd Agent-Service && ./.venv/bin/uvicorn main:app --host 0.0.0.0 --port 9002 --reload

volumes:
  gitea-data:
