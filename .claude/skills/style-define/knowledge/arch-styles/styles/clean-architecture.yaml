id: clean-architecture
name: "Clean Architecture"
scope: module_boundary
category: internal-structure
summary: "의존성 규칙(안쪽 레이어는 바깥을 모름)을 강제하는 동심원 모듈 구조."
description: |
  Entities → UseCases → Interface Adapters → Frameworks/Drivers 순의 동심원.
  바깥 레이어는 안쪽에만 의존. Hexagonal/Onion의 동치에 가까운 개념으로,
  시스템 수준이 아니라 모듈 내부 구조에 채택.

fit_signals:
  modifiability: high
  testability: high
  domain_complexity: high
  long_term_maintenance: high

avoid_signals:
  simple_crud: high
  short_lifecycle: high
  team_size: small

prerequisites:
  technical: []
  design:
    - dependency_inversion
    - layer_boundary_enforcement
    - use_case_separation
  organizational:
    developer_discipline: medium_or_higher

quality_attributes:
  - attribute: modifiability
    effect: positive
    strength: high
  - attribute: testability
    effect: positive
    strength: high
  - attribute: portability
    effect: positive
    strength: medium
  - attribute: simplicity
    effect: negative
    strength: medium
  - attribute: code_volume
    effect: negative
    strength: medium

combines_well_with:
  - style: modular-monolith
    reason: "모놀리스 내 모듈 구조로 의존성 규칙 강제"
  - style: microservices
    reason: "서비스 내부 구조로 채택해 교체 용이성 확보"
  - style: hexagonal
    reason: "동치에 가까운 개념으로 혼용 가능"

conflicts_with: []

operational_complexity: low
observability_requirement: low
testing_complexity: low
consistency_model: n/a
interaction_mode: n/a
team_maturity_required: medium_or_higher
failure_handling_patterns: []

decision_rules:
  - if:
      simple_crud: high
    then:
      score: -3
      reason: "단순 CRUD에 동심원 분리는 과설계"
  - if:
      modifiability: high
      domain_complexity: high
    then:
      score: +3
      reason: "복잡 도메인에서 장기 유지보수성과 변경 용이성 확보"
  - if:
      testability: high
    then:
      score: +2
      reason: "도메인/유스케이스 단위 테스트가 용이"

tradeoffs:
  pros:
    - "프레임워크/DB 교체에 강함"
    - "도메인 규칙 테스트 용이"
    - "장기 유지보수성 향상"
  cons:
    - "초기 코드/매핑 레이어 증가"
    - "작은 과제에 과설계"
    - "의존성 규칙 규율이 흔들리면 효익 소실"

related_patterns: [hexagonal, layered]

references:
  - "Robert C. Martin, Clean Architecture"
