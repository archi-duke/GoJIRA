# 아키텍처 스타일 카탈로그 인덱스 (v2)
#
# 스키마 상세: ./SCHEMA.md
#
# 책임:
#   1) 정규화 속성 어휘(attributes) — 요구사항 정규화 단계의 허용 키/값
#   2) scope 정의 — 같은 scope 내에서만 conflicts_with 허용
#   3) 엔진 가중치(weights) — 점수 계산 기본값
#
# 주의:
#   - 개별 스타일의 적합/회피 신호는 각 styles/{id}.yaml 의 fit_signals / avoid_signals
#     가 단일 진실 출처. 본 파일의 requirement_mapping은 폐지.

# ── 정규화 속성 어휘 ────────────────────────────────────────
#
# 값 체계:
#   - 3단계: low | medium | high
#   - 강제: required (high보다 강)
#   - 비교: medium_or_higher | medium_or_lower (fit/avoid 신호에서만)
#   - 없음: none

attributes:
  # 품질속성
  scalability: [low, medium, high, required]
  modifiability: [low, medium, high]
  availability: [low, medium, high, required]
  performance: [low, medium, high]
  security: [low, medium, high, required]
  consistency: [eventual, strong, required]
  latency: [low, medium, high]                 # low = 낮은 지연 요구(엄격)
  auditability: [low, medium, high]
  debuggability: [low, medium, high]
  testability: [low, medium, high]
  simplicity: [low, medium, high]
  portability: [low, medium, high]
  decoupling: [low, medium, high]

  # 요구 패턴 / 워크로드
  event_volume: [low, medium, high]
  async_processing_need: [low, medium, high]
  synchronous_low_latency: [low, medium, high]
  real_time_processing: [low, medium, high]
  read_write_ratio_skewed: [low, medium, high]
  sporadic_workload: [low, medium, high]
  simple_crud: [low, medium, high]
  data_volume: [low, medium, high]
  domain_complexity: [low, medium, high]
  long_running_job: [low, medium, high]
  stateful_heavy: [low, medium, high]
  short_lifecycle: [low, medium, high]
  long_term_maintenance: [low, medium, high]

  # 프론트엔드 특화
  large_ui_codebase: [low, medium, high]
  polyglot_frontend_tech: [low, medium, high]
  strict_ui_consistency: [low, medium, high]

  # 인프라/규모
  service_count: [low, medium, high]
  multi_cluster: [low, medium, high]
  inter_service_traffic_control: [low, medium, high]
  observability_requirement: [low, medium, high]
  strong_vendor_independence: [low, medium, high]

  # 조직/운영
  team_size: [small, medium, large]
  ops_maturity: [low, medium, high]
  release_frequency: [low, medium, high]
  team_independent_deploy: [low, medium, high]
  ui_team_independence: [low, medium, high]
  strong_consistency: [low, medium, high]      # 요구 강도

# ── scope 정의 ───────────────────────────────────────────────
#
# 규칙: conflicts_with 는 같은 scope 에 속한 스타일 간에만 선언.
# 서로 다른 scope 는 직교(orthogonal) 또는 조합 가능으로 간주.

scopes:
  system_structure:
    description: "시스템 전체 구조 (모놀리스 vs 분산 등)"
    examples: [microservices, modular-monolith, micro-frontend]
  integration:
    description: "컴포넌트/서비스 간 통합 방식"
    examples: [event-driven]
  interaction:
    description: "요청/응답 상호작용 방식"
    examples: []
  deployment:
    description: "실행/배포 모델"
    examples: [serverless]
  data:
    description: "데이터 처리/저장 패턴"
    examples: [cqrs]
  module_boundary:
    description: "모듈 내부 구조 규칙"
    examples: [hexagonal, clean-architecture, layered]
  infrastructure:
    description: "인프라 레이어 보조 패턴"
    examples: [service-mesh]

# ── 전역 조합 노트 (style 파일의 combines_well_with 보완용) ──
#
# 개별 스타일에 이미 reason 이 있으므로 본 섹션은 선택적 전역 코멘트.
# 추천 엔진은 style 파일의 combines_well_with / conflicts_with 를 우선 참조.

combinations_notes:
  microservices + service-mesh:
    note: "서비스 수 증가 시 통신/보안/관측 통제에 service-mesh가 운영 부담 경감"
  hexagonal + clean-architecture:
    note: "둘 다 module_boundary scope. clean이 의존성 규칙을 더 엄격하게 규정."
  modular-monolith + hexagonal:
    note: "모듈 경계를 포트/어댑터로 강화해 향후 분리 용이."

# ── 엔진 가중치 ─────────────────────────────────────────────

weights:
  fit_signal_match: 10           # fit_signals 매칭(레벨 정확 일치) 기본 가산
  fit_signal_partial: 5          # medium_or_higher 등 완화 매칭
  avoid_signal_match: -20        # avoid_signals 매칭 감점
  qa_positive_strength:          # quality_attributes.effect=positive 매칭 시
    low: 3
    medium: 6
    high: 10
  qa_negative_strength:          # quality_attributes.effect=negative 매칭 시
    low: -2
    medium: -5
    high: -10
  prerequisite_unmet:
    technical: 0                 # 경고만 (LLM에 근거 전달)
    design: -5
    organizational: -15
  combines_bonus: 5              # combines_well_with 쌍으로 함께 추천될 때
  conflict_penalty: -25          # conflicts_with 쌍으로 같이 뽑혔을 때

# ── 엔진 설정 ────────────────────────────────────────────────

engine:
  top_n: 5                       # 상위 N 후보
  tie_threshold: 3               # 점수 차 3 이내는 동점으로 취급 → LLM이 최종 결정
  structured_output:
    primary_min_score: 50
    secondary_min_score: 30
