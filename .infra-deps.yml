# 이 앱이 shared-infra 에서 실제 의존하는 계약 표면.
# 리스너/훅이 이 선언으로 "나와 무관한 변경"을 걸러낸다. (알림 스팸 방지)
# redis 는 현재 미사용 — 사용 시작할 때 services 에 추가할 것.
# gitea 는 shared-infra 이관 예정(활성화 대기, docs/decisions/2026-07-05-decisions.md D2).
name: GoJIRA
services: [mongo, gitea]
mongo_dbs: [gojira]
env_keys: [GOJIRA_MONGO_PASSWORD]
