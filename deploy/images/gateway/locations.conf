# GoJIRA 게이트웨이 라우팅 — 모든 브라우저 대면 트래픽의 단일 진입점.
# entrypoint.sh 가 생성하는 server 블록에서 include 된다.
#   $connection_upgrade : entrypoint 가 만든 map (WebSocket 업그레이드)
#   $forwarded_proto    : server 블록의 set (외부 스킴 http|https)
#
# 경로 체계 v2 (2026-07-06): 제품 하나 = 프리픽스 하나.
#   /<제품>/          → 제품 프론트(remote)
#   /<제품>/api/v2/…  → 제품 백엔드 (게이트웨이는 /<제품> 만 strip — 백엔드는 /api/v2/… 로 수신)
#   /platform/api/…   → 공용 Platform-API (셸 프론트는 / 루트라 /platform/ 프론트 경로 없음)
# 구 경로(/platform-api/, /gojira-api/, /gojira-app/, /ragaas-api/, /ragaas-app/)는
# 한시적 호환 alias — 구버전 런처(≤0.1.15)의 파생 URL 대비. 런처 fleet 업데이트 후 제거.
#
# nginx prefix location 은 최장일치 — /gojira/api/ 가 /gojira/ 보다 우선.

client_max_body_size 100m;

# RAGaaS 컨테이너는 별도 스택(shared-net)이라 미배포일 수 있음 — upstream 을 기동 시점에
# 해석하지 않고 변수+resolver(Docker 내장 DNS)로 요청 시점에 해석한다. 부재 시 해당 경로만 502.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── 공용 Platform-API ────────────────────────────────────────────────────
location /platform/api/ {
    proxy_pass http://platform-api:9000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # WebSocket(Notice/ws) 업그레이드 + SSE(Notice/stream) 스트리밍
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# platform-api 의 비-/api 루트 경로 — webhook (Gitea 가 게이트웨이 경유로 쏠 수 있게).
# 런처 다운로드는 /api/v2/launcher/* 라 위 블록으로 처리됨.
location /platform/webhook/ {
    proxy_pass http://platform-api:9000/webhook/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# ── GoJIRA ───────────────────────────────────────────────────────────────
location /gojira/api/ {
    proxy_pass http://gojira-api:9001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
}

# standalone HTML 진입은 셸 딥링크로 수렴 (2026-07-07 D4) — remote 는 바디 전용이라
# 단독 화면에는 크롬(타이틀바/플랫폼 메뉴/사용자 정보)이 없다. 사용자 진입점은 셸 하나.
# exact match(=)라 /gojira/assets/… /gojira/remoteEntry.js /gojira/api/… 는 안 걸린다.
location = /gojira/ { return 302 /gojira; }
location = /ragaas/ { return 302 /ragaas; }

# 셸 딥링크(슬래시 없음)는 exact match 로 셸에 못 박는다. 이게 없으면 nginx 가
# 프리픽스 location(/gojira/)의 암묵 규칙으로 /gojira 에 301 →/gojira/ 를 돌려줘
# 위 302 와 무한루프가 된다 (그리고 딥링크 자체가 standalone 으로 새 왔다).
location = /gojira {
    proxy_pass http://platform-app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}
location = /ragaas {
    proxy_pass http://platform-app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# GoJIRA-App (Module Federation remote). publicPath 'auto' 상당이라 remoteEntry.js 가
# /gojira/ 하위에서 로드되면 청크/자산도 같은 프리픽스로 자동 해석된다.
# 셸 탭 딥링크 /gojira·/ragaas (슬래시 없음)는 프리픽스에 안 걸려 셸(/)로 간다.
# 이 프리픽스 블록은 셸이 로드하는 remote 자산·env.js 전용 (standalone 진입은 위에서 302).
location /gojira/ {
    proxy_pass http://gojira-app:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# ── RAGaaS (2호 제품) — 런타임 DNS ───────────────────────────────────────
location /ragaas/api/ {
    set $ragaas_api ragaas-backend;
    rewrite ^/ragaas(/api/.*)$ $1 break;
    proxy_pass http://$ragaas_api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location /ragaas/ {
    set $ragaas_app ragaas-frontend;
    rewrite ^/ragaas/(.*)$ /$1 break;
    proxy_pass http://$ragaas_app:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# ── 부속: pumlex 렌더러 — GoJIRA-App PexBlock 이 /pumlex/render-with-layout 호출 ──
location /pumlex/ {
    proxy_pass http://pumlex-server:3030/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 300s;
}

# ══ 구 경로 호환 alias (deprecated — 런처 ≤0.1.15 대비, fleet 업데이트 후 제거) ══
location /platform-api/ {
    proxy_pass http://platform-api:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}
location /gojira-api/ {
    proxy_pass http://gojira-api:9001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
}
location /gojira-app/ {
    proxy_pass http://gojira-app:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}
location /ragaas-api/ {
    set $ragaas_api_legacy ragaas-backend;
    rewrite ^/ragaas-api/(.*)$ /$1 break;
    proxy_pass http://$ragaas_api_legacy:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}
location /ragaas-app/ {
    set $ragaas_app_legacy ragaas-frontend;
    rewrite ^/ragaas-app/(.*)$ /$1 break;
    proxy_pass http://$ragaas_app_legacy:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# ── Platform-App (shell SPA) — 루트. 위 프리픽스에 안 걸리는 모든 요청 ──
location / {
    proxy_pass http://platform-app:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}
