# GoJIRA 게이트웨이 라우팅 — 모든 브라우저 대면 트래픽의 단일 진입점.
# entrypoint.sh 가 생성하는 server 블록에서 include 된다.
#   $connection_upgrade : entrypoint 가 만든 map (WebSocket 업그레이드)
#   $forwarded_proto    : server 블록의 set (외부 스킴 http|https)
#
# proxy_pass 끝의 "/" 가 location 프리픽스를 strip 한다.
#   예) /platform-api/api/v2/Account  →  platform-api:9000/api/v2/Account

client_max_body_size 100m;

# ── 백엔드 API ───────────────────────────────────────────────────────────
location /platform-api/ {
    proxy_pass http://platform-api:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # WebSocket(Notice/ws) 업그레이드 + SSE(Notice/stream) 스트리밍
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location /gojira-api/ {
    proxy_pass http://gojira-api:9001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
}

# pumlex 렌더러 — GoJIRA-App PexBlock 이 /pumlex/render-with-layout 호출.
location /pumlex/ {
    proxy_pass http://pumlex-server:3030/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 300s;
}

# ── RAGaaS (2호 제품, 온보딩 B3) ─────────────────────────────────────────
# RAGaaS 컨테이너는 별도 스택(shared-net)으로 배포된다 — 아직 미배포일 수 있으므로
# upstream 을 nginx 기동 시점에 해석하지 않고 변수+resolver(Docker 내장 DNS 127.0.0.11)로
# 요청 시점에 해석한다. 컨테이너가 없으면 502 (셸은 RAGaaS 탭 자체를 env 게이트로 숨김).
resolver 127.0.0.11 valid=10s ipv6=off;

location /ragaas-api/ {
    set $ragaas_api ragaas-backend;
    rewrite ^/ragaas-api/(.*)$ /$1 break;
    proxy_pass http://$ragaas_api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location /ragaas-app/ {
    set $ragaas_app ragaas-frontend;
    rewrite ^/ragaas-app/(.*)$ /$1 break;
    proxy_pass http://$ragaas_app:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# ── 프론트엔드 ───────────────────────────────────────────────────────────
# GoJIRA-App (Module Federation remote). 양쪽 빌드가 publicPath:'auto' 상당이라
# remoteEntry.js 가 /gojira-app/ 하위에서 로드되면 청크/자산도 같은 프리픽스로
# 자동 해석된다 (chunk path inline 안 됨).
location /gojira-app/ {
    proxy_pass http://gojira-app:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# Platform-App (shell SPA) — 루트. 위 프리픽스에 안 걸리는 모든 요청.
location / {
    proxy_pass http://platform-app:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}
