server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 캐시 정책 ────────────────────────────────────────────────────────────
    # 기준: **파일명에 내용 해시가 박힌 것만** 장기 immutable.
    # 근거와 배경은 platform-app/nginx.conf 의 같은 블록에 적어 두었다.
    # 이 앱에만 있는 것: public/pex-core/*.js (pumlex vendor 복사본) — 이름 고정.
    #
    # Access-Control-Allow-Origin: 셸이 cross-origin 으로 가져가는 파일
    # (remoteEntry, /assets/ 청크, pex-core)에는 반드시 남겨 둔다. 캐시 정리하면서
    # 이 헤더를 떨어뜨리면 remote 로드가 CORS 로 죽는다.

    # MF 진입점 — 이름 고정. 셸이 매번 최신을 봐야 remote 버전이 어긋나지 않는다.
    location ~ ^/remoteEntry(\.ssr)?\.js$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # 런타임 config — 컨테이너 startup 시 entrypoint 가 생성. 절대 캐시 금지.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # pumlex vendor 복사본 — public/ 에서 그대로 복사돼 내용 해시가 없다.
    # pumlex 를 재동기화해도 URL 이 그대로라, immutable 이면 7일간 옛 렌더러를
    # 쓴다 (PexBlock 렌더 결과가 조용히 어긋남). 매번 재검증한다.
    location ^~ /pex-core/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 내용 해시 자산 — 여기만 장기 캐시. `^~` 라 정규식 location 보다 우선한다.
    # expires 는 쓰지 않는다 (Cache-Control 을 중복으로 두 줄 내보낸다).
    location ^~ /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # 나머지(index.html·icons·logo·manifest·favicon) — 이름 고정이라 매번 재검증.
    # ETag 로 304 가 떨어져 바디는 0바이트다.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
