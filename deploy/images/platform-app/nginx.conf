server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 캐시 정책 ────────────────────────────────────────────────────────────
    # 기준: **파일명에 내용 해시가 박힌 것만** 장기 immutable.
    #
    # Vite 는 해시 자산을 전부 /assets/ 아래에만 떨어뜨린다. 그 밖(index.html,
    # remoteEntry*.js, env.js, public/ 복사본 — icons·logo·manifest·favicon)은
    # **재배포해도 URL 이 그대로**다. 이름이 고정인 파일에 immutable 을 붙이면
    # 브라우저가 최대 7일간 옛 것을 들고 있고, immutable 은 일반 새로고침에서
    # 재검증조차 건너뛴다 → "배포했는데 안 바뀐다" 가 된다.
    #
    # 2026-11-19 이전 설정은 `location ~* \.(js|css|...)$` 로 확장자만 보고
    # 전부 7일 immutable 을 걸어, 해시 없는 파일까지 같이 묶여 있었다.
    # (/assets/mf-entry-bootstrap-0-<h>.js 는 해시다 — 그 h 는 자기 내용의
    #  sha256 앞 8자리이고, 내용이 해시된 실제 entry 파일명을 담는다. 즉
    #  앱 코드가 바뀌면 이 파일명도 바뀐다. 안전하다.)

    # MF 진입점 — 이름 고정. 셸이 매번 최신을 봐야 remote 버전이 어긋나지 않는다.
    location ~ ^/remoteEntry(\.ssr)?\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # 런타임 config — 컨테이너 startup 시 entrypoint 가 생성. 절대 캐시 금지.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # 내용 해시 자산 — 여기만 장기 캐시. `^~` 라 정규식 location 보다 우선한다.
    # expires 는 쓰지 않는다 (Cache-Control 을 중복으로 두 줄 내보낸다).
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # SPA fallback — React Router 등 client routing 지원.
    # index.html 은 해시 자산의 이름표다. 이게 캐시되면 옛 자산을 가리키고,
    # 그 자산은 immutable 로 멀쩡히 캐시에 있어 배포가 통째로 묻힌다.
    # no-cache = 저장은 하되 매번 재검증 (ETag → 304, 바디 0바이트).
    # 명시 헤더가 없으면 브라우저가 heuristic freshness(Last-Modified 경과의
    # 약 10%)로 제멋대로 수 시간 캐시한다 — 그게 이전 동작이었다.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
