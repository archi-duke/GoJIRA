server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Module Federation remoteEntry.js 는 cache 비활성화 (배포마다 갱신 필요)
    location = /remoteEntry.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 런타임 config — 컨테이너 startup 시 entrypoint 가 생성. 절대 캐시 금지.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback — React Router 등 client routing 지원
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산은 hash 가 들어가 있어 장기 캐시 가능
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
