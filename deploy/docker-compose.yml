# GoJIRA 사내 폐쇄망 배포 docker-compose
# ─────────────────────────────────────────────────────────────────────────────
# - MongoDB / Gitea 는 사내 별도 인프라 사용 (이 compose 에 포함 안 함)
#   MongoDB 를 shared-infra 스택(RAGaaS 와 공유, docs/shared-infra-handoff.md)으로
#   쓰는 경우: shared-infra 를 먼저 기동(shared-net 생성) 후 이 스택 기동.
#   shared-net 없이 단독 기동하려면 `docker network create shared-net` 1회 실행.
# - 모든 환경변수는 deploy/.env 한 곳에서 atomic 입력 (host/port/user/pass)
# - 조합된 URL (MONGO_URI / GOJIRA_API_URL / REACT_APP_* 등) 은 이 파일에서 만듦
# - 빌드 context 는 레포 루트 (이 파일 기준 ..)
#
# `${VAR:?...}` 형식은 .env 에 해당 변수가 비어있으면 compose 가 fail-fast.
# `${A:-${B:-x}}` 형식은 A 미설정 시 B, B 도 미설정 시 default x.

x-build-context: &build-context
  context: ..

# React 두 앱이 사용하는 런타임 env. nginx entrypoint 가 컨테이너 startup 시
# env → /usr/share/nginx/html/env.js 로 직렬화 → window._env_ 로 노출.
# 더 이상 build-arg 가 아니므로 스킴/호스트 변경 시 React 재빌드 불요 — 컨테이너
# recreate (docker compose up -d) 만 하면 즉시 반영.
#
# 모든 URL 은 gateway 단일 진입점(GATEWAY_HOST:GATEWAY_PORT) + 경로 프리픽스로 조합.
# URL_SCHEME=https 면 gateway 가 TLS 종단하고 여기 URL 이 https 로 조합된다
# (WebSocket 은 프론트가 http→ws 치환하므로 자동으로 wss). http(기본)면 평문.
x-react-env: &react-env
  REACT_APP_PLATFORM_API: "${URL_SCHEME:-http}://${GATEWAY_HOST:?required}:${GATEWAY_PORT:?required}/platform-api/api/v2"
  REACT_APP_GOJIRA_API: "${URL_SCHEME:-http}://${GATEWAY_HOST:?required}:${GATEWAY_PORT:?required}/gojira-api/api/v2"
  REACT_APP_GOJIRA_APP_REMOTE: "${URL_SCHEME:-http}://${GATEWAY_HOST:?required}:${GATEWAY_PORT:?required}/gojira-app"
  REACT_APP_PUMLEX_SERVER: "${URL_SCHEME:-http}://${GATEWAY_HOST:?required}:${GATEWAY_PORT:?required}/pumlex"
  REACT_APP_SSO_URL: "${REACT_APP_SSO_URL:-https://10.227.37.90:443}"
  REACT_APP_USE_SSO: "${REACT_APP_USE_SSO:-false}"
  # dev 폴백 신원 — 백엔드 DEV_USER 와 같은 소스 (계약 05 §6)
  REACT_APP_DEV_USER: "${DEV_USER:-duke.kimm}"
  # RAGaaS remote origin (온보딩 B2) — 기본 빈값 = 셸에 RAGaaS 탭 미노출.
  # RAGaaS 스택 합류 시 .env 에 RAGAAS_APP_REMOTE 지정 (게이트웨이 경유 권장:
  # RAGAAS_APP_REMOTE=${URL_SCHEME}://${GATEWAY_HOST}:${GATEWAY_PORT}/ragaas-app)
  REACT_APP_RAGAAS_APP_REMOTE: "${RAGAAS_APP_REMOTE:-}"

# 백엔드 SSO 인증 env (auth 미들웨어). USE_SSO 는 프론트 토글과 동일 소스라 같이 켜진다.
# USE_SSO=false(기본)면 X-User-Id/DEV_USER 폴백 → 동작 무변. SSO 모드 켤 때:
#  - SSO_INTROSPECT_URL: 백엔드(컨테이너)에서 MobilAve 에 도달하는 주소(mock 은 host.docker.internal:8443)
#  - SERVICE_TOKEN: 런처/CLI/스킬/서비스간 호출이 X-Service-Token 으로 제시할 공유 비밀
x-sso-backend-env: &sso-backend-env
  USE_SSO: "${REACT_APP_USE_SSO:-false}"
  SSO_INTROSPECT_URL: "${SSO_INTROSPECT_URL:-}"
  SERVICE_TOKEN: "${SERVICE_TOKEN:-}"
  SSO_INSECURE_TLS: "${SSO_INSECURE_TLS:-false}"
  DEV_USER: "${DEV_USER:-duke.kimm}"

services:

  # ── 외부 도구: PlantUML 렌더링 서버 ───────────────────────────────────────
  # pumlex-server 가 compose-internal DNS (plantuml-server:8080) 로 호출.
  # 브라우저에서 직접 호출하지 않으므로 호스트 포트 노출 없음.
  plantuml-server:
    image: plantuml/plantuml-server:jetty
    restart: unless-stopped
    expose:
      - "8080"

  # ── 외부 도구: pumlex (plantumlEx) 렌더러 ─────────────────────────────────
  # GoJIRA-App PexBlock 이 런타임에 /render-with-layout 호출. 내부적으로
  # plantuml-server:8080 을 호출해 SVG 를 받고 pex-core layout delta 적용.
  pumlex-server:
    build:
      <<: *build-context
      dockerfile: deploy/images/pumlex-server/Dockerfile
    image: gojira/pumlex-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 호스트에 직접 노출하지 않는다 — gateway 가 /pumlex/ 로 프록시.
    expose:
      - "3030"
    environment:
      PORT: "3030"
      # compose 내부 DNS 로 plantuml 컨테이너 직접 호출 (브라우저 경유 아님).
      PLANTUML_URL: "http://plantuml-server:8080"
    depends_on:
      - plantuml-server

  # ── 런처 배포 이미지 (init job) ───────────────────────────────────────────
  # gojira-launcher 를 OS 3종으로 cross-compile + embed 해 공유 볼륨(launcher-dist)에
  # 채우고 종료한다. platform-api 가 그 볼륨을 read-only 로 서빙(/api/v2/launcher/*).
  # 소스 복사 빌드 모델에 통합 — `docker compose build` 가 런처까지 빌드, 별도 손작업 없음.
  launcher-dist:
    build:
      <<: *build-context
      dockerfile: deploy/images/launcher-dist/Dockerfile
    image: gojira/launcher-dist:${IMAGE_TAG:-latest}
    restart: "no"
    volumes:
      - launcher-dist:/shared

  # ── 백엔드: Platform-API ──────────────────────────────────────────────────
  platform-api:
    build:
      <<: *build-context
      dockerfile: deploy/images/platform-api/Dockerfile
    image: gojira/platform-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 호스트 사용자 권한으로 실행 — ${GOJIRA_REPOS_DIR} bind mount fs 권한 일치.
    # 향후 OpenCode 스킬이 같은 디렉토리를 직접 read/write 할 때도 권한 충돌 없음.
    user: "${UID:-1000}:${GID:-1000}"
    # 호스트에 직접 노출하지 않는다 — gateway 가 /platform-api/ 로 프록시.
    expose:
      - "9000"
    # shared-net: shared-mongo(공유 MongoDB) + RAGaaS API 도달용 (external 네트워크)
    networks: [default, shared-net]
    environment:
      MONGO_URI: "mongodb://${MONGO_USER:?required}:${MONGO_PASS:?required}@${MONGODB_SERVER:?required}/?authSource=${MONGO_AUTH_SOURCE:-admin}"
      PLATFORM_GITHUB_TOKEN: "${PLATFORM_GITHUB_TOKEN:?required}"
      PLATFORM_GITHUB_ORG: "${PLATFORM_GITHUB_ORG:?required}"
      GITHUB_URL: "http://${GITEA_SERVER:?required}/"
      GOJIRA_API_URL: "http://gojira-api:9001/api/v2"
      GOJIRA_ENC_KEY: "${GOJIRA_ENC_KEY:-}"
      <<: *sso-backend-env
      # 알림 발송 (선택) — smtp | internal(사내 API) | none, 미설정 시 자동 판별
      NOTIFY_PROVIDER: "${NOTIFY_PROVIDER:-}"
      NOTIFY_API_URL: "${NOTIFY_API_URL:-}"
      NOTIFY_API_TOKEN: "${NOTIFY_API_TOKEN:-}"
      # SMTP (NOTIFY_PROVIDER=smtp 또는 자동 판별 시)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      # LLM (선택 — llm.json 의 active provider 에 따라 사용됨)
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      PLATFORM_LLM_TICKET: "${PLATFORM_LLM_TICKET:-}"
      PLATFORM_LLM_USER_ID: "${PLATFORM_LLM_USER_ID:-}"
    volumes:
      # 호스트 bind mount — Platform-API 와 (향후) OpenCode 가 같은 fs 공유.
      # ${GOJIRA_REPOS_DIR} 는 호스트 측 절대/상대 경로 (compose 가 .env 에서 해석).
      - ${GOJIRA_REPOS_DIR:-../repos}:/data/repos
      # 사내 LLM swap 위해 llm.json 외부 주입 (없으면 이미지에 내장된 default 사용)
      - ./config/llm.json:/app/config/llm.json:ro
      # 런처 바이너리(OS별) — launcher-dist init job 이 채운 공유 볼륨을 read-only 서빙.
      # /api/v2/launcher/download/{os} · /launcher/version 이 여기서 stream.
      - launcher-dist:/app/launcher-dist:ro
    depends_on:
      # 런처 산출물이 볼륨에 채워진 뒤 기동 (init job 완료 대기).
      launcher-dist:
        condition: service_completed_successfully

  # ── 백엔드: GoJIRA-API ────────────────────────────────────────────────────
  gojira-api:
    build:
      <<: *build-context
      dockerfile: deploy/images/gojira-api/Dockerfile
    image: gojira/gojira-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 호스트에 직접 노출하지 않는다 — gateway 가 /gojira-api/ 로 프록시.
    expose:
      - "9001"
    # shared-net: shared-mongo(공유 MongoDB) + RAGaaS API 도달용 (external 네트워크)
    networks: [default, shared-net]
    environment:
      MONGO_URI: "mongodb://${MONGO_USER:?required}:${MONGO_PASS:?required}@${MONGODB_SERVER:?required}/?authSource=${MONGO_AUTH_SOURCE:-admin}"
      GOJIRA_PLATFORM_API: "http://platform-api:9000/api/v2"
      GOJIRA_JIRA_URL: "http://jira-api:8000"
      GOJIRA_JIRA_USER: "${GOJIRA_JIRA_USER:-}"
      GOJIRA_JIRA_PASS: "${GOJIRA_JIRA_PASS:-}"
      GOJIRA_ENC_KEY: "${GOJIRA_ENC_KEY:-}"
      <<: *sso-backend-env
    depends_on:
      - platform-api

  # ── 백엔드: JIRA Mock ─────────────────────────────────────────────────────
  jira-api:
    build:
      <<: *build-context
      dockerfile: deploy/images/jira-api/Dockerfile
    image: gojira/jira-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${JIRA_API_HOST_PORT:-8000}:8000"

  # ── 프론트엔드: Platform-App ──────────────────────────────────────────────
  # 런타임 config — REACT_APP_* 는 environment 로 주입되며 entrypoint 가 env.js 생성.
  # 호스트/포트 변경 시 재빌드 불요. `docker compose up -d` 만으로 반영.
  platform-app:
    build:
      <<: *build-context
      dockerfile: deploy/images/platform-app/Dockerfile
    image: gojira/platform-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 호스트에 직접 노출하지 않는다 — gateway 가 / (루트) 로 프록시.
    expose:
      - "3000"
    environment:
      <<: *react-env

  # ── 프론트엔드: GoJIRA-App ────────────────────────────────────────────────
  gojira-app:
    build:
      <<: *build-context
      dockerfile: deploy/images/gojira-app/Dockerfile
    image: gojira/gojira-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 호스트에 직접 노출하지 않는다 — gateway 가 /gojira-app/ 로 프록시.
    expose:
      - "3001"
    environment:
      <<: *react-env

  # ── 게이트웨이: TLS 종단 리버스 프록시 ───────────────────────────────────
  # 모든 브라우저 대면 트래픽의 단일 진입점. URL_SCHEME=https 면 인증서로 TLS 종단,
  # 아니면 평문. 경로(/, /gojira-app, /platform-api, /gojira-api, /pumlex)로
  # 백엔드에 프록시한다. 백엔드는 전부 컨테이너 내부 HTTP — gateway 포트만 노출.
  # 스킴 전환은 URL_SCHEME 만 바꾸고 `docker compose up -d` — 재빌드 불요.
  gateway:
    build:
      <<: *build-context
      dockerfile: deploy/images/gateway/Dockerfile
    image: gojira/gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:?required}:${GATEWAY_PORT:?required}"
    environment:
      URL_SCHEME: "${URL_SCHEME:-http}"
      GATEWAY_PORT: "${GATEWAY_PORT:?required}"
      TLS_CERT_FILE: "/etc/gojira/tls/fullchain.pem"
      TLS_KEY_FILE: "/etc/gojira/tls/privkey.pem"
    volumes:
      # URL_SCHEME=https 일 때 fullchain.pem + privkey.pem 을 read-only 로 읽는다.
      # http 모드면 디렉토리가 비어 있어도 무방(설정이 인증서를 참조하지 않음).
      - ${TLS_CERT_DIR:-./certs}:/etc/gojira/tls:ro
    depends_on:
      - platform-app
      - gojira-app
      - platform-api
      - gojira-api
      - pumlex-server
    # shared-net 조인 — /ragaas-app/, /ragaas-api/ 프록시가 RAGaaS 스택 컨테이너
    # (ragaas-frontend/ragaas-backend, 별도 compose)에 도달하기 위함 (온보딩 B3).
    # RAGaaS 미배포 환경에서도 무해: locations.conf 가 런타임 DNS(resolver)로 해석해
    # 컨테이너 부재 시 해당 경로만 502, 게이트웨이 기동엔 영향 없음.
    networks:
      - default
      - shared-net

# 볼륨
# - launcher-dist: launcher-dist init job 이 채우고 platform-api 가 read-only 로 서빙.
#   매 `up -d` 마다 init 이 재실행되어 최신 런처 산출물로 덮어쓴다.
# - repos 는 named volume 대신 ${GOJIRA_REPOS_DIR} 호스트 bind mount 사용(위 platform-api).
#   기존 platform-repos volume 데이터가 있다면 호스트 디렉토리로 이전 후 `docker volume rm deploy_platform-repos`.
volumes:
  launcher-dist:

# shared-net: shared-infra 스택(D:\works\shared-infra)이 생성하는 공용 네트워크.
# shared-mongo(공유 MongoDB) 와 RAGaaS backend(http://ragaas-backend:8000) 도달용.
# external 이므로 이 compose 기동 전에 존재해야 한다 (shared-infra 먼저 up,
# 또는 `docker network create shared-net`).
networks:
  shared-net:
    external: true
