# GoJIRA reverse proxy — sub_filter 로 React 번들 내 하드코딩 IP 를 $host 로 동적 치환.
# gzip off + Accept-Encoding "" 로 upstream 압축을 막아 sub_filter 가 동작하게 함.

gzip off;

server {
    listen 44300;
    location / {
        proxy_pass         http://platform-app:3000;
        proxy_set_header   Host              $http_host;
        proxy_set_header   Accept-Encoding   "";
        sub_filter         '10.211.55.3'     '$host';
        sub_filter_once    off;
        sub_filter_types   *;
    }
}

server {
    listen 44301;
    location / {
        proxy_pass         http://gojira-app:3001;
        proxy_set_header   Host              $http_host;
        proxy_set_header   Accept-Encoding   "";
        sub_filter         '10.211.55.3'     '$host';
        sub_filter_once    off;
        sub_filter_types   *;
    }
}

# Pumlex — Mac 호스트(10.211.55.2:3030) 중계
server {
    listen 3030;
    location / {
        proxy_pass http://10.211.55.2:3030;
        proxy_set_header Host $http_host;
    }
}
