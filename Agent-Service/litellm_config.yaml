# LiteLLM 프록시 설정 — Gemini 네이티브 함수호출을 OpenAI 호환 인터페이스로 중계
#
# 실행:
#   cd Agent-Service
#   .venv/bin/litellm --config litellm_config.yaml --port 4000
# (백그라운드: nohup ... > /tmp/litellm.log 2>&1 &)
#
# 이 프록시는 Gemini 만 담당. OpenAI 는 llm.json 에서 api.openai.com 로 직결.

model_list:
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-flash-latest
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-pro-latest
    litellm_params:
      model: gemini/gemini-pro-latest
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true           # OpenAI 전용 파라미터(logit_bias 등) 자동 제거
  set_verbose: false
  request_timeout: 120

general_settings:
  master_key: sk-gojira-local  # 로컬 전용 더미 키 (실제 Gemini 키는 env 에서 proxy 가 읽음)
