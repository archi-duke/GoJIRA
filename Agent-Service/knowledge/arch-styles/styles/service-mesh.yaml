id: service-mesh
name: "Service Mesh"
scope: infrastructure
category: infrastructure-pattern
summary: "서비스 간 통신을 사이드카 프록시로 일원화해 보안/관측/트래픽 제어를 인프라로 분리."
description: |
  서비스 코드에서 네트워크/보안 관심사를 분리해 사이드카(Envoy 등)로 위임한다.
  Microservices 환경의 통신 제어 부담을 경감하나 인프라 복잡도를 증가시킨다.
  단독 시스템 스타일이 아니라 Microservices 위에 얹는 보조 패턴.

fit_signals:
  service_count: high
  security: high
  observability_requirement: high
  multi_cluster: high
  inter_service_traffic_control: high

avoid_signals:
  team_size: small
  ops_maturity: low
  service_count: low
  simple_crud: high

prerequisites:
  technical:
    - microservices_base
    - kubernetes_or_equivalent
    - sidecar_runtime
  design:
    - traffic_policy
    - mtls_configuration
  organizational:
    ops_maturity: high

quality_attributes:
  - attribute: security
    effect: positive
    strength: high
  - attribute: observability
    effect: positive
    strength: high
  - attribute: availability
    effect: positive
    strength: medium
  - attribute: manageability
    effect: positive
    strength: medium
  - attribute: simplicity
    effect: negative
    strength: high
  - attribute: latency
    effect: negative
    strength: low
  - attribute: resource_efficiency
    effect: negative
    strength: medium

combines_well_with:
  - style: microservices
    reason: "서비스 수 증가 시 통신/보안/관측 부담을 인프라로 위임"
  - style: event-driven
    reason: "mesh 구간 밖의 브로커와 공존 가능 (서비스 간 sync 트래픽만 mesh 통제)"

conflicts_with: []

operational_complexity: high
observability_requirement: high
testing_complexity: medium
consistency_model: n/a
interaction_mode: synchronous
team_maturity_required: high
failure_handling_patterns:
  - retry
  - circuit_breaker
  - timeout
  - canary_rollout

decision_rules:
  - if:
      ops_maturity: low
    then:
      score: -5
      reason: "메시 자체의 학습곡선/운영 부담이 커 저성숙 조직에 비권장"
  - if:
      service_count: low
    then:
      score: -3
      reason: "서비스 수가 적으면 투자 대비 효익이 낮음"
  - if:
      service_count: high
      security: high
    then:
      score: +3
      reason: "다수 서비스의 mTLS/정책을 일관되게 강제 가능"
  - if:
      observability_requirement: high
    then:
      score: +2
      reason: "통합 분산 트레이스/메트릭 수집을 코드 밖에서 표준화"

tradeoffs:
  pros:
    - "mTLS/재시도/서킷브레이커를 코드 밖으로 분리"
    - "통합 관측성(분산 트레이스/메트릭)"
    - "정책 기반 트래픽 제어(canary, A/B)"
  cons:
    - "사이드카 리소스/지연 오버헤드"
    - "메시 자체의 운영 학습곡선"
    - "장애 지점 추가"

related_patterns: [microservices]

references:
  - "Istio / Linkerd 공식 문서"
  - "Posta, Istio in Action"
