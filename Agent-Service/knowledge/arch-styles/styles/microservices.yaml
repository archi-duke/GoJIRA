id: microservices
name: "Microservices"
scope: system_structure
category: distributed
summary: "독립 배포 가능한 소단위 서비스 집합으로 구성되는 분산 시스템 구조."
description: |
  비즈니스 역량을 경계로 서비스를 분리하고 네트워크 경유로 협력한다.
  서비스별 독립 배포/확장/기술 스택이 가능하나 운영 복잡도가 높다.
  서비스 내부 구조는 hexagonal/clean-architecture 등과 결합해 정련.

fit_signals:
  scalability: high
  team_independent_deploy: high
  release_frequency: high
  availability: high
  domain_complexity: medium_or_higher

avoid_signals:
  team_size: small
  ops_maturity: low
  strong_consistency: high
  synchronous_low_latency: high
  simple_crud: high

prerequisites:
  technical:
    - container_platform
    - service_discovery
    - distributed_tracing
    - ci_cd_pipeline
  design:
    - api_contract
    - bounded_context
    - idempotency
    - retry_policy
    - circuit_breaker
  organizational:
    ops_maturity: medium_or_higher
    team_size: medium_or_higher

quality_attributes:
  - attribute: scalability
    effect: positive
    strength: high
  - attribute: modifiability
    effect: positive
    strength: high
  - attribute: availability
    effect: positive
    strength: medium
  - attribute: consistency
    effect: negative
    strength: high
  - attribute: simplicity
    effect: negative
    strength: high
  - attribute: debuggability
    effect: negative
    strength: high
  - attribute: latency
    effect: negative
    strength: medium

combines_well_with:
  - style: event-driven
    reason: "서비스 간 비동기 통합으로 결합도 완화"
  - style: service-mesh
    reason: "서비스 수 증가 시 통신/보안/관측 통제 부담 경감"
  - style: cqrs
    reason: "서비스 경계 내 쓰기/읽기 모델 분리"
  - style: micro-frontend
    reason: "백엔드 독립 배포와 짝을 이루는 프론트 독립 배포"
  - style: hexagonal
    reason: "서비스 내부의 포트/어댑터 구조로 변경 용이성 확보"

conflicts_with:
  - style: modular-monolith
    reason: "같은 system_structure scope에서 택일 관계"

operational_complexity: high
observability_requirement: high
testing_complexity: high
consistency_model: eventual
interaction_mode: mixed
team_maturity_required: medium_or_higher
failure_handling_patterns:
  - circuit_breaker
  - retry_policy
  - timeout
  - bulkhead
  - saga

decision_rules:
  - if:
      team_size: small
    then:
      score: -3
      reason: "서비스 수만큼 운영 부담이 증가해 소규모 팀에 과부하"
  - if:
      ops_maturity: low
    then:
      score: -3
      reason: "관측성/배포/장애 대응 운영 성숙도 부족 시 리스크 큼"
  - if:
      release_frequency: high
      team_independent_deploy: high
    then:
      score: +3
      reason: "독립 배포로 릴리즈 빈도와 팀 자율성 동시 확보"
  - if:
      strong_consistency: high
    then:
      score: -2
      reason: "분산 환경에서 즉시 강한 일관성 달성 비용이 큼"
  - if:
      scalability: high
    then:
      score: +2
      reason: "서비스 단위 독립 확장이 자연스러움"

tradeoffs:
  pros:
    - "독립 배포로 릴리즈 빈도 향상"
    - "팀/기술 스택 자율성"
    - "장애 격리 및 부분 확장"
  cons:
    - "분산 트랜잭션/일관성 난이도"
    - "네트워크 레이턴시/오류 처리 증가"
    - "관측성/운영 도구 초기 투자 큼"
    - "흔한 실패: 분산 모놀리스(서비스 분리는 했으나 결합도 여전)"

related_patterns: [event-driven, service-mesh, cqrs, hexagonal]

references:
  - "Richardson, Microservices Patterns"
  - "Newman, Building Microservices"
