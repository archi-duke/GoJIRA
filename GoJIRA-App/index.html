<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="GoJIRA project/issue management" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!--
      런타임 config — nginx entrypoint 가 컨테이너 startup 시 env.js 를 생성한다.
      window._env_ 로 모든 REACT_APP_* 값을 노출. src/config.js 가 1순위로 읽음.
      dev 모드(npm start)에서는 public/env.js 가 있으면 로드, 없으면 404 →
      window._env_ 미정의 → src/config.js 가 env/fallback 으로 동작.
    -->
    <script src="/env.js"></script>
    <link rel="manifest" href="/manifest.json" />
    <title>GoJIRA</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--
      pex-core (pumlex 프로젝트) — geom/meta/inline 공용 모듈.
      UMD 패턴이라 번들 import 보다 plain script 로 로드해 window.{PexGeom,PexMeta,PexInline} 노출.
      DocEditor.js 의 PexBlock 컴포넌트가 window.PexInline.activate(...) 호출.
      module/exports/require 가 전역에 leak 된 환경에서 UMD 가 Node 분기로
      빠져 require('./pex-geom') 에서 throw 되므로, 로드 직전 가리고 직후 복구한다.
      (pumlex vendor 파일 자체는 수정하지 않는다.)
    -->
    <script>
      window.__pexSaved = {
        module: window.module,
        exports: window.exports,
        require: window.require,
      };
      window.module = undefined;
      window.exports = undefined;
      window.require = undefined;
    </script>
    <script src="/pex-core/geom.js"></script>
    <script src="/pex-core/meta.js"></script>
    <script src="/pex-core/inline.js"></script>
    <script>
      window.module = window.__pexSaved.module;
      window.exports = window.__pexSaved.exports;
      window.require = window.__pexSaved.require;
      delete window.__pexSaved;
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
